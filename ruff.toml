               "F403", "F405", "E741"]
"scratch/*" = ["I", "UP", "SIM", "PIE", "RUF", "BLE", "EXE", "N", "PLW", "FURB", "S",
               "F401", "F841", "F811", "E401", "E402", "E701", "E702", "E703", "E731",
               "F403", "F405", "E741"]
"tools/*" = ["I", "UP", "SIM", "PIE", "RUF", "BLE", "EXE", "N", "PLW", "FURB", "S",
