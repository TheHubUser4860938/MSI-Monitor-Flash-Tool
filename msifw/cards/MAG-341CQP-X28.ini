; IspSetting.ini — the model card msifw reads for the MSI MAG 341CQP QD-OLED X28.
;
; Every key and every default here is the literal `WinIspPlugIn.dll` pushes at its read site, so
; this file only needs the lines that DIFFER from the built-in configuration. The sections are the
; plugin's own 19; values are base 0 (`0x…` is hex, a bare number is decimal).
;
; Measured on this box: the panel answers at 7-bit 0x49 (8-bit 0x92) on the DP-1 adapter. The
; plugin's built-in `ucSpecifiedSlave` is 0x94 = 7-bit 0x4A, which does not answer here.

[ISP_Basic]
; 0x92 = 7-bit 0x49, the address the panel ACKs on. The built-in 0x94 (0x4A) NACKs on this box.
ucSpecifiedSlave = 0x92

[Background_ISP_Settging]
; The section name carries the vendor's own typo. 4500 rounds x 10 ms is 45 s of handshake;
; 40 rounds is 0.4 s and enough for a warm panel.
ulPollingCount = 40

[ISP_Flash]
; The card names the part it was built for; leave it empty to let the RDID answer pick the row.
strSpecifiedFlashName =
ulDumpFlashAddr = 0x0
ulDumpFlashLen = 0x1E0000
strDumpFileName = dumpflash.bin

[ISP_Fw]
; The bank the programming starts at. 0 = ask the panel (`Get Program Start Bank`).
ulProgStartBank = 0
