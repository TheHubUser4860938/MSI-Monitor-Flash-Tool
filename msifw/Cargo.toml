[package]
name = "msifw"
version = "0.1.0"
edition = "2021"
description = "Linux-native MSI monitor firmware tool, reconstructed from MSI Firmware Update Utility V1.0.6"
license = "MIT"

[[bin]]
name = "msifw"
path = "src/main.rs"

[dependencies]
libc = "0.2"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
